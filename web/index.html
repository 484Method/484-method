<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Treino oral de inglês para brasileiros. Escute, repita, grave e receba feedback em português.">

  <!-- Theme color — Android Chrome address bar + task switcher -->
  <meta name="theme-color" content="#1B2D4F">

  <!-- iOS PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="484 Method">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>484 Method</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Splash de boot. O app Flutter leva alguns segundos pra pintar o primeiro
    frame (baixa ~3 MB de bundle e o main() espera o Supabase), e sem isto a
    tela fica BRANCA nesse intervalo — foi o que os testadores viram em
    2026-09-16, quando o projeto Supabase estava pausado e o boot demorava.
    Navy/creme são as cores da marca (iguais às de main.dart).
  -->
  <style>
    html, body { margin: 0; padding: 0; background: #1B2D4F; }
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #1B2D4F; color: #F5F2EB;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    #boot .mark { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
    #boot .spin {
      width: 28px; height: 28px; margin: 20px 0 14px;
      border: 3px solid rgba(245, 242, 235, 0.25);
      border-top-color: #C9A252; border-radius: 50%;
      animation: boot-spin 0.9s linear infinite;
    }
    #boot .msg { font-size: 15px; opacity: 0.85; }
    /* Só aparece se o boot demorar — silêncio prolongado assusta mais que
       uma frase honesta. */
    #boot .slow { font-size: 13px; opacity: 0; margin-top: 10px; max-width: 320px;
                  transition: opacity 0.4s ease; }
    #boot.is-slow .slow { opacity: 0.7; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #boot .spin { animation: none; }
    }
  </style>

  <div id="boot">
    <div class="mark">484 Method</div>
    <div class="spin"></div>
    <div class="msg">Carregando seu treino…</div>
    <div class="slow">Está demorando mais que o normal. Se não abrir, confira
      sua conexão e recarregue a página.</div>
  </div>

  <script>
    // Listener registrado ANTES do bootstrap (que é async), então não há
    // corrida: o primeiro frame nunca chega antes daqui.
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var slow = setTimeout(function () { boot.classList.add('is-slow'); }, 10000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(slow);
        boot.remove();
      });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
