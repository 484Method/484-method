name: Diagnóstico Supabase + Azure (temporário)

# TEMPORÁRIO — removido no commit seguinte. Testa de dentro do GitHub (que
# alcança o Supabase) cada elo do loop de avaliação: projeto acordado, gateway
# das functions, login anônimo, function assess e a resposta do Azure.
# Cria 1 usuário anônimo de teste e faz 1 chamada ao Azure com 1s de silêncio.

on:
  push:
    branches: [claude/festive-allen-t9z1e3]
    paths: ['.github/workflows/diag-assess.yml']
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          U="$SUPABASE_URL"; K="$SUPABASE_ANON_KEY"
          short() { head -c 600; echo; }
          case "$K" in eyJ*) echo "chave pública: JWT legado (anon)";; sb_publishable_*) echo "chave pública: NOVA (sb_publishable_)";; *) echo "chave pública: formato desconhecido";; esac

          echo "== 0. Projeto acordado? (leitura pública em app_config)"
          curl -sS -m 30 "$U/rest/v1/app_config?select=key&limit=5" -H "apikey: $K" -H "Authorization: Bearer $K" -w '\nHTTP %{http_code}\n' | short || true

          for fn in assess feedback dev-stats; do
            echo "== 1. $fn SEM token"
            curl -sS -m 30 -X POST "$U/functions/v1/$fn" -H "apikey: $K" -H "Content-Type: application/json" -d '{}' -w '\nHTTP %{http_code}\n' | short || true
          done

          echo "== 2. Login anônimo"
          SIGNUP=$(curl -sS -m 30 -X POST "$U/auth/v1/signup" -H "apikey: $K" -H "Content-Type: application/json" -d '{}')
          TOKEN=$(echo "$SIGNUP" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then echo "login anônimo FALHOU:"; echo "$SIGNUP" | short; exit 0; fi
          echo "token ok; alg: $(echo "$TOKEN" | cut -d. -f1 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r .alg)"

          echo "== 3. assess COM token + 1s de silêncio (resposta = Azure)"
          python3 - <<'PY' > body.json
          import base64, io, json, wave
          b = io.BytesIO()
          w = wave.open(b, 'wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
          w.writeframes(b'\x00\x00' * 16000); w.close()
          print(json.dumps({"referenceText": "hello", "audioBase64": base64.b64encode(b.getvalue()).decode(), "attempt": 1}))
          PY
          RES=$(curl -sS -m 60 -X POST "$U/functions/v1/assess" -H "apikey: $K" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @body.json -w '\n%{http_code}')
          CODE=$(echo "$RES" | tail -n1); BODY=$(echo "$RES" | sed '$d')
          echo "HTTP $CODE"; echo "$BODY" | short
          case "$CODE" in
            200) echo "VEREDITO: Azure OK — avaliação funcionando";;
            401) if echo "$BODY" | grep -q unauthorized; then echo "VEREDITO: a function recusou o login"; else echo "VEREDITO: Azure recusou a chave (AZURE_SPEECH_KEY/REGION)"; fi;;
            403) echo "VEREDITO: Azure 403 — assinatura suspensa ou sem cota";;
            429) echo "VEREDITO: teto diário atingido";;
            503) echo "VEREDITO: AZURE_SPEECH_KEY não configurada";;
            *) echo "VEREDITO: resposta inesperada";;
          esac

          echo "== 4. Site publicado (GitHub Pages)"
          curl -sS -m 30 -o /dev/null -w 'app HTTP %{http_code}\n' https://484method.github.io/484-method/ || true
          curl -sS -m 30 -I https://484method.github.io/484-method/main.dart.js | grep -i -E '^(HTTP|last-modified)' || true
