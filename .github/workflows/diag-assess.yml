name: Diagnóstico assess 401 (temporário)

# TEMPORÁRIO — removido no commit seguinte. Descobre de onde vem o 401 da
# avaliação de pronúncia (gateway do Supabase × a própria function × Azure),
# rodando de dentro do GitHub, que alcança o Supabase. Cria 1 usuário anônimo
# de teste e faz 1 chamada ao Azure com 1s de silêncio (custo desprezível).

on:
  push:
    branches: [claude/festive-allen-t9z1e3]
    paths: ['.github/workflows/diag-assess.yml']
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          U="$SUPABASE_URL"; K="$SUPABASE_ANON_KEY"
          short() { head -c 400; echo; }
          case "$K" in eyJ*) echo "chave pública: JWT legado (anon)";; sb_publishable_*) echo "chave pública: NOVA (sb_publishable_)";; *) echo "chave pública: formato desconhecido";; esac

          echo "== 0. Projeto acordado? (leitura pública em app_config)"
          curl -sS -m 30 "$U/rest/v1/app_config?select=key&limit=1" -H "apikey: $K" -H "Authorization: Bearer $K" -o /dev/null -w 'HTTP %{http_code}\n' || true

          for fn in assess feedback dev-stats; do
            echo "== 1. $fn SEM token (mostra se o gateway exige JWT)"
            curl -sS -m 30 -X POST "$U/functions/v1/$fn" -H "apikey: $K" -H "Content-Type: application/json" -d '{}' -w '\nHTTP %{http_code}\n' | short || true
          done

          echo "== 2. Login anônimo"
          SIGNUP=$(curl -sS -m 30 -X POST "$U/auth/v1/signup" -H "apikey: $K" -H "Content-Type: application/json" -d '{}')
          TOKEN=$(echo "$SIGNUP" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then echo "login anônimo FALHOU:"; echo "$SIGNUP" | short; exit 0; fi
          echo "token ok; alg do JWT do usuário: $(echo "$TOKEN" | cut -d. -f1 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r .alg)"

          echo "== 3. assess COM token do usuário + 1s de silêncio"
          python3 - <<'PY' > body.json
          import base64, io, json, wave
          b = io.BytesIO()
          w = wave.open(b, 'wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
          w.writeframes(b'\x00\x00' * 16000); w.close()
          print(json.dumps({"referenceText": "hello", "audioBase64": base64.b64encode(b.getvalue()).decode(), "attempt": 1}))
          PY
          curl -sS -m 60 -X POST "$U/functions/v1/assess" -H "apikey: $K" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @body.json -w '\nHTTP %{http_code}\n' | short || true
